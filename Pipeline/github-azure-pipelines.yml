# GCFoundation.Web - Build and Deploy pipeline (from GitHub)
# Created: 2026-04-20
#
# Runs once per change reaching master (merge push), not on every PR sync.
# Azure Pipelines cannot trigger on GitHub "PR approved" alone; pair this with
# GitHub branch protection on master (required reviews before merge).
trigger:
  branches:
    include:
      - master
  paths:
    include:
      - GCFoundation.Web/
      - Pipeline/

pr: none

pool:
  vmImage: 'windows-latest'

resources:
  repositories:
   - repository: templates
     type: git
     name: 'TBS DevOps Master/DevOps Templates'
     ref: 'refs/heads/develop'

variables:
- template: variables.yaml
- name: enableTruffleHogScan
  value: false
- name: allowFlaggedSecrets
  value: true
- name: solution
  value: '**/*.sln'
- name: buildPlatform
  value: 'Any CPU'
- name: buildConfiguration
  value: 'Release'

stages:
- stage: build_gcfoundationweb_app
  displayName: 'Build'
  jobs:
  - job: Job_1
    displayName: Agent job 1
    steps:
    - checkout: self
      clean: true
      fetchDepth: 1
    - task: UseDotNet@2
      displayName: Install .NET SDK
      inputs:
        packageType: sdk
        version: ${{ variables.dotnetSdkVersion }}
    - task: DotNetCoreCLI@2
      displayName: Restore
      inputs:
        command: restore
        projects: ${{ variables.projects }}
        feedsToUse: select
        vstsFeed: TBS_Custom_Feed
        noCache: true
        verbosityRestore: Detailed
        verbosityPack: Detailed
    - task: DotNetCoreCLI@2
      displayName: Build projects
      inputs:
        projects: ${{ variables.projects }}
        arguments: '--configuration ${{ variables.buildConfiguration }} --no-restore'
        verbosityRestore: Detailed
        verbosityPack: Detailed
    - task: DotNetCoreCLI@2
      displayName: Publish Web App
      inputs:
        command: publish
        publishWebProjects: True
        projects: $(BuildParameters.RestoreBuildProjects)
        arguments: --configuration $(BuildConfiguration) --output $(Build.BinariesDirectory)/publish_output
        zipAfterPublish: false
        modifyOutputPath: false
        verbosityRestore: Detailed
        verbosityPack: Detailed
    - task: ArchiveFiles@2
      displayName: Archive $(Build.BinariesDirectory)/publish_output/
      inputs:
        rootFolderOrFile: $(Build.BinariesDirectory)/publish_output
        includeRootFolder: false
        archiveFile: $(Build.ArtifactStagingDirectory)/GCFoundation.Web.zip
    - task: PublishBuildArtifacts@1
      displayName: Publish Artifact
      condition: succeededOrFailed()
      inputs:
        PathtoPublish: $(build.artifactstagingdirectory)
        TargetPath: '\\my\share\$(Build.DefinitionName)\$(Build.BuildNumber)'

- stage: deploy_dev
  dependsOn: build_gcfoundationweb_app
  jobs:
  - deployment: deploy_app_dev
    variables:
      - template: './transforms/dev/appsettings.yaml'
      - template: './transforms/dev/deployment.yaml'
    environment: ${{ variables.deploymentEnvironment }}
    strategy:
      runOnce:
        deploy:
          steps:
          - template: Deploy/DotNetCore/deploy-steps.yaml@templates
            parameters:
              azureSubscription: ${{ variables.azureSubscription }}
              pathToPackage: ${{ variables.pathToPackage }}
              resourceGroupName: ${{ variables.resourceGroupName }}
              slotName: ${{ variables.slotName }}
              virtualDirectoryName: ${{ variables.virtualDirectoryName }}
              webAppName: ${{ variables.webAppName }}

- stage: deploy_uat
  #dependsOn: deploy_qa
  dependsOn: deploy_dev
  jobs:
  - deployment: deploy_app_uat
    variables:
      - template: './transforms/uat/appsettings.yaml'
      - template: './transforms/uat/deployment.yaml'
    environment: ${{ variables.deploymentEnvironment }}
    strategy:
      runOnce:
        deploy:
          steps:
          - template: Deploy/DotNetCore/deploy-steps.yaml@templates
            parameters:
              azureSubscription: ${{ variables.azureSubscription }}
              pathToPackage: ${{ variables.pathToPackage }}
              resourceGroupName: ${{ variables.resourceGroupName }}
              slotName: ${{ variables.slotName }}
              useSlot: ${{ variables.useSlot }}
              virtualDirectoryName: ${{ variables.virtualDirectoryName }}
              webAppName: ${{ variables.webAppName }}